name: HyperAI vNext quality checks

on:
  push:
    branches:
      - hyperai-vnext/remake-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Node.js ${{ matrix.node-version }} quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.22.1
          - 26.12.1
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
