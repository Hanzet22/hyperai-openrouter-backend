<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="Local-first animated OpenRouter AI client">

  <title>HyperAI // OpenRouter</title>

  <style>
    :root {
      --bg-0: #05070b;
      --bg-1: #080c15;
      --panel: rgba(12, 17, 28, 0.72);
      --panel-solid: #0d1420;
      --panel-2: rgba(17, 24, 39, 0.84);
      --line: rgba(148, 163, 184, 0.16);
      --line-strong: rgba(148, 163, 184, 0.28);
      --text: #eef4ff;
      --muted: #8c99ad;
      --accent: #62a8ff;
      --accent-2: #8b5cff;
      --cyan: #42e8ff;
      --danger: #ff5f7a;
      --success: #45e0a0;
      --user: linear-gradient(135deg, rgba(54, 104, 180, 0.28), rgba(98, 168, 255, 0.10));
      --assistant: linear-gradient(135deg, rgba(28, 38, 58, 0.76), rgba(16, 22, 35, 0.82));
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg-0);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------------------------------------------------------
       BACKGROUND ANIMATION
       --------------------------------------------------------- */

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 15%, rgba(98, 168, 255, 0.09), transparent 28%),
        radial-gradient(circle at 82% 17%, rgba(139, 92, 255, 0.11), transparent 28%),
        radial-gradient(circle at 50% 92%, rgba(66, 232, 255, 0.07), transparent 34%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -45%;
      background:
        linear-gradient(
          transparent 49.5%,
          rgba(98, 168, 255, 0.045) 50%,
          transparent 50.5%
        ),
        linear-gradient(
          90deg,
          transparent 49.5%,
          rgba(98, 168, 255, 0.035) 50%,
          transparent 50.5%
        );
      background-size: 64px 64px;
      transform: perspective(600px) rotateX(67deg) translateY(18%);
      transform-origin: center bottom;
      animation: gridDrift 18s linear infinite;
    }

    .orb {
      position: absolute;
      width: 42vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.16;
      animation: orbit 16s ease-in-out infinite;
    }

    .orb.a { top: -24vw; left: -12vw; background: #2d7fff; }
    .orb.b { top: 10vh; right: -20vw; background: #8b3dff; animation-delay: -5s; }
    .orb.c { bottom: -28vw; left: 34vw; background: #00c8ff; animation-delay: -10s; }

    .cursor-glow {
      position: fixed;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(98, 168, 255, 0.10), transparent 68%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(4px);
    }

    @keyframes gridDrift {
      from { transform: perspective(600px) rotateX(67deg) translateY(18%) translateY(0); }
      to   { transform: perspective(600px) rotateX(67deg) translateY(18%) translateY(64px); }
    }

    @keyframes orbit {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(4vw, 5vh, 0) scale(1.08); }
    }

    /* ---------------------------------------------------------
       APP SHELL & GUI
       --------------------------------------------------------- */

    .app {
      position: relative;
      z-index: 2;
      width: min(1180px, 100%);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: rgba(4, 7, 12, 0.46);
      border-inline: 1px solid rgba(255,255,255,0.04);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(12,17,28,0.92), rgba(8,12,20,0.74));
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(98,168,255,0.28);
      border-radius: 14px;
      background: radial-gradient(circle at 35% 30%, rgba(98,168,255,0.30), transparent 46%), rgba(12, 20, 34, 0.86);
      box-shadow: inset 0 0 24px rgba(98,168,255,0.08), 0 0 24px rgba(98,168,255,0.06);
      overflow: hidden;
    }

    .brand-copy h1 {
      font-size: 14px;
      line-height: 1.1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-copy p {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .top-status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(8, 13, 22, 0.58);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      transition: 0.25s ease;
    }

    .status-dot.ready { background: var(--success); box-shadow: 0 0 12px rgba(69, 224, 160, 0.72); }
    .status-dot.busy { background: var(--accent); box-shadow: 0 0 12px rgba(98, 168, 255, 0.72); animation: pulse 1s infinite; }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 12px rgba(255, 95, 122, 0.72); }

    @keyframes pulse { 50% { transform: scale(1.4); opacity: 0.6; } }

    /* ---------------------------------------------------------
       USER-FRIENDLY CONTROLS (AWAM-FRIENDLY GUI)
       --------------------------------------------------------- */

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 14, 23, 0.60);
    }

    .control label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .select, .mini-btn {
      width: 100%;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(16, 24, 38, 0.9), rgba(10, 16, 27, 0.9));
      cursor: pointer;
      transition: 0.2s;
    }

    .select:hover, .mini-btn:hover {
      border-color: rgba(98,168,255,0.4);
    }

    .mini-btn.primary {
      background: linear-gradient(135deg, rgba(98,168,255,0.25), rgba(139,92,255,0.2));
      border-color: rgba(98,168,255,0.5);
    }

    .mini-btn.danger {
      color: #ffb4c2;
      border-color: rgba(255,95,122,0.3);
    }

    /* ---------------------------------------------------------
       CHAT INTERFACE
       --------------------------------------------------------- */

    .chat-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .chat {
      height: 100%;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 28px 18px;
    }

    .welcome {
      width: min(720px, 100%);
      margin: 10vh auto 0;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-badge {
      display: inline-flex;
      padding: 6px 12px;
      border-radius: 999px;
      color: #bfd7ff;
      background: rgba(11,18,31,0.8);
      border: 1px solid var(--line);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .welcome h2 {
      margin-top: 15px;
      font-size: clamp(26px, 4vw, 44px);
      background: linear-gradient(90deg, #ffffff, #a9ccff, #d0bbff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .quick {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(10, 16, 27, 0.6);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .quick:hover {
      transform: translateY(-3px);
      border-color: rgba(98,168,255,0.4);
      background: rgba(16,24,39,0.8);
    }

    .quick strong { display: block; font-size: 11px; margin-bottom: 3px; }
    .quick span { color: var(--muted); font-size: 10px; }

    .message {
      width: min(900px, 100%);
      margin: 0 auto 18px;
      display: flex;
      gap: 10px;
      animation: msgIn 0.3s ease;
    }

    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(16, 24, 39, 0.9);
      border: 1px solid var(--line);
      font-size: 11px;
    }

    .bubble-wrap { max-width: 85%; }
    .meta { font-size: 9px; color: #738096; margin-bottom: 4px; text-transform: uppercase; }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid var(--line);
      word-break: break-word;
    }

    .message.user .bubble { background: var(--user); border-color: rgba(98,168,255,0.25); border-top-right-radius: 4px; }
    .message.assistant .bubble { background: var(--assistant); border-top-left-radius: 4px; }

    .bubble pre { margin: 8px 0; padding: 10px; background: rgba(2,6,13,0.7); border-radius: 8px; overflow-x: auto; }
    .bubble code { font-family: monospace; font-size: 11px; }

    /* ---------------------------------------------------------
       COMPOSER (INPUT BAWAH)
       --------------------------------------------------------- */

    .composer {
      padding: 12px 18px max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(10,15,24,0.85);
      backdrop-filter: blur(18px);
    }

    .composer-inner {
      width: min(900px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .prompt-wrap { position: relative; flex: 1; }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      resize: none;
      padding: 12px 45px 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: rgba(16,24,38,0.9);
      font-size: 13px;
      line-height: 1.45;
    }

    textarea:focus { border-color: rgba(98,168,255,0.5); box-shadow: 0 0 0 3px rgba(98,168,255,0.08); }

    .char-count { position: absolute; right: 12px; bottom: 8px; font-size: 8px; color: var(--muted); }

    .send, .stop {
      width: 48px; height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(98,168,255,0.4);
      background: linear-gradient(135deg, rgba(98,168,255,0.3), rgba(139,92,255,0.25));
      color: white;
      cursor: pointer;
      display: grid; place-items: center;
      transition: 0.2s;
    }

    .send:hover { transform: scale(1.03); }
    .stop { display: none; background: linear-gradient(135deg, rgba(255,95,122,0.3), rgba(139,92,255,0.2)); border-color: rgba(255,95,122,0.4); }

    .composer-tools {
      width: min(900px, 100%);
      margin: 6px auto 0;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 9px;
    }

    .tool-btn {
      background: rgba(10,16,26,0.5);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px 8px;
      color: #8fa1b8;
      cursor: pointer;
    }
    .tool-btn:hover { color: var(--text); border-color: var(--line-strong); }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed; left: 50%; bottom: 85px; z-index: 50;
      transform: translate(-50%, 15px);
      padding: 8px 14px; border-radius: 10px;
      background: rgba(8,13,22,0.95);
      border: 1px solid var(--line-strong);
      color: #d9e6fb; font-size: 11px;
      opacity: 0; pointer-events: none; transition: 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* RESPONSIVE */
    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
      .quick-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="scene" aria-hidden="true">
    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  </div>
  <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span>✦</span></div>
        <div class="brand-copy">
          <h1>HyperAI // OpenRouter</h1>
          <p>Super AI Client · Free & Canggih</p>
        </div>
      </div>
      <div class="top-status">
        <div class="status-pill">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Siap</span>
        </div>
      </div>
    </header>

    <!-- GUI RAMAH ORANG AWAM (DENGAN 5 LEVEL THINKING & SEARCH TOGGLE) -->
    <section class="controls">
      <div class="control">
        <label for="thinkingLevel">🧠 Mode Berpikir AI</label>
        <select id="thinkingLevel" class="select">
          <option value="off">⚡ Kilat (Tanpa Pikir Panjang)</option>
          <option value="low">💡 Santai (Ringan)</option>
          <option value="medium" selected>⚖️ Standar (Seimbang Rekomendasi)</option>
          <option value="high">🔍 Teliti (Analisis Mendalam)</option>
          <option value="ultra">🚀 Jenius (Maximal Reasoning)</option>
        </select>
      </div>

      <div class="control">
        <label for="searchToggleBtn">🌐 Akses Internet / Web</label>
        <button id="searchToggleBtn" class="mini-btn" type="button">🌐 Cari di Web: MATI</button>
      </div>

      <div class="control">
        <label>🧹 Reset Percakapan</label>
        <button id="clearBtn" class="mini-btn danger" type="button">Hapus Chat</button>
      </div>
    </section>

    <section class="chat-wrap">
      <main id="chat" class="chat">
        <div id="welcome" class="welcome">
          <div class="welcome-badge">⚡ HYPERAI OFFICIAL CONSOLE</div>
          <h2>Mau nanya apa hari ini, Bre?</h2>
          <p>Tinggal ketik di bawah atau pilih topik cepat di bawah ini buat mulai ngobrol santai.</p>

          <div class="quick-grid">
            <button class="quick" type="button" data-prompt="Jelaskan cara kerja jaringan internet dengan bahasa tongkrongan yang gampang dipahami.">
              <strong>Jaringan & IT</strong>
              <span>Penjelasan simpel & asyik</span>
            </button>
            <button class="quick" type="button" data-prompt="Cek dan kasih tahu info berita teknologi terbaru minggu ini pakai pencarian web!">
              <strong>Berita Terbaru</strong>
              <span>Cari info real-time web</span>
            </button>
            <button class="quick" type="button" data-prompt="Buatkan tips biar jago ngoding JavaScript dari nol buat pemula.">
              <strong>Belajar Coding</strong>
              <span>Tips pemula langsung paham</span>
            </button>
          </div>
        </div>
      </main>
    </section>

    <section class="composer">
      <div class="composer-inner">
        <div class="prompt-wrap">
          <textarea id="prompt" rows="1" maxlength="12000" placeholder="Ketik pesan atau pertanyaan di sini... Enter = Kirim"></textarea>
          <span id="charCount" class="char-count">0 / 12000</span>
        </div>
        <button id="sendBtn" class="send" type="button">➤</button>
        <button id="stopBtn" class="stop" type="button">■</button>
      </div>

      <div class="composer-tools">
        <div class="tool-group">
          <button id="copyLastBtn" class="tool-btn" type="button">Salin Jawaban Terakhir</button>
          <button id="regenBtn" class="tool-btn" type="button">Ulangi Respon</button>
        </div>
        <div class="tool-group">
          <span>Model: openrouter/free</span>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    "use strict";

    const API_URL = "/api/chat";
    const SYSTEM_MESSAGE = {
      role: "system",
      content: "Lu adalah HyperAI, asisten chat yang asyik, santai, gokil, dan friendly banget. Gunakan bahasa Indonesia gaul, kasual khas tongkrongan, pakai kata 'lu', 'gua', 'bre', 'wkwkwk', atau 'coy'. JANGAN PERNAH pakai bahasa baku, kaku, atau formal (seperti 'Anda', 'Saya', 'terima kasih atas pertanyaan Anda') kecuali user yang minta secara spesifik. Jawab dengan ringkas, punchy, dan langsung ke intinya!"
    };

    const $ = (selector) => document.querySelector(selector);
    const chat = $("#chat"), welcome = $("#welcome"), promptInput = $("#prompt");
    const sendBtn = $("#sendBtn"), stopBtn = $("#stopBtn"), clearBtn = $("#clearBtn");
    const copyLastBtn = $("#copyLastBtn"), regenBtn = $("#regenBtn");
    const thinkingSelect = $("#thinkingLevel"), searchToggleBtn = $("#searchToggleBtn");
    const charCount = $("#charCount"), toast = $("#toast"), statusDot = $("#statusDot"), statusText = $("#statusText");

    let messages = [], lastUserPrompt = "", activeController = null, generating = false, searchEnabled = false, toastTimer = null;

    function updateStatus(text, state = "") {
      statusText.textContent = text;
      statusDot.className = "status-dot " + state;
    }

    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    // Toggle Web Search Awom-friendly
    searchToggleBtn.addEventListener("click", () => {
      searchEnabled = !searchEnabled;
      searchToggleBtn.textContent = searchEnabled ? "🌐 Cari di Web: AKTIF" : "🌐 Cari di Web: MATI";
      searchToggleBtn.classList.toggle("primary", searchEnabled);
      showToast(searchEnabled ? "Fitur pencarian web diaktifkan!" : "Pencarian web dimatikan.");
    });

    function autoResize() {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + "px";
      charCount.textContent = `${promptInput.value.length} / 12000`;
    }

    promptInput.addEventListener("input", autoResize);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function escapeHTML(str) {
      return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function renderMarkdown(text) {
      let safe = escapeHTML(text);
      const codeBlocks = [];
      safe = safe.replace(/```([\s\S]*?)```/g, (_, block) => {
        const idx = codeBlocks.push(block.trim()) - 1;
        return `@@CODEBLOCK_${idx}@@`;
      });
      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      safe = safe.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      safe = safe.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
      safe = safe.replace(/\n{2,}/g, "</p><p>");
      safe = "<p>" + safe + "</p>";
      codeBlocks.forEach((b, i) => safe = safe.replace(`@@CODEBLOCK_${i}@@`, `<pre><code>${b}</code></pre>`));
      return safe;
    }

    function createMessage(role, content = "") {
      if (welcome) welcome.style.display = "none";
      const wrap = document.createElement("article");
      wrap.className = `message ${role}`;
      wrap.innerHTML = `
        <div class="avatar">${role === "user" ? "YOU" : "AI"}</div>
        <div class="bubble-wrap">
          <div class="meta">${role === "user" ? "USER" : "HYPERAI SYSTEM"}</div>
          <div class="bubble">${content ? renderMarkdown(content) : ""}</div>
        </div>
      `;
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap.querySelector(".bubble");
    }

    function setGenerating(val) {
      generating = val;
      sendBtn.style.display = val ? "none" : "grid";
      stopBtn.style.display = val ? "grid" : "none";
      promptInput.disabled = val;
      updateStatus(val ? "Sedang Berpikir..." : "Siap", val ? "busy" : "ready");
    }

    async function sendMessage(customPrompt = null) {
      if (generating) return;
      const prompt = customPrompt || promptInput.value.trim();
      if (!prompt) return;

      lastUserPrompt = prompt;
      messages.push({ role: "user", content: prompt });
      createMessage("user", prompt);
      promptInput.value = "";
      autoResize();

      const aiBubble = createMessage("assistant");
      aiBubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      setGenerating(true);
      activeController = new AbortController();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          signal: activeController.signal,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "openrouter/free",
            messages: [SYSTEM_MESSAGE, ...messages],
            thinkingLevel: thinkingSelect.value,
            enableSearch: searchEnabled
          })
        });

        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") break;
            try {
              const json = JSON.parse(payload);
              const delta = json?.choices?.[0]?.delta?.content;
              if (delta) {
                fullText += delta;
                aiBubble.innerHTML = renderMarkdown(fullText);
                chat.scrollTop = chat.scrollHeight;
              }
            } catch {}
          }
        }

        if (!fullText.trim()) throw new Error("Respon kosong dari server.");
        messages.push({ role: "assistant", content: fullText });
        updateStatus("Siap", "ready");
      } catch (err) {
        if (err.name === "AbortError") {
          aiBubble.innerHTML = "<p><em>Percakapan dihentikan.</em></p>";
        } else {
          aiBubble.innerHTML = `<p style="color:var(--danger)"><strong>Gagal:</strong> ${escapeHTML(err.message)}</p>`;
          showToast("Gagal memuat respon!");
        }
        updateStatus("Error", "error");
      } finally {
        activeController = null;
        setGenerating(false);
      }
    }

    sendBtn.addEventListener("click", () => sendMessage());
    stopBtn.addEventListener("click", () => activeController?.abort());
    clearBtn.addEventListener("click", () => {
      activeController?.abort();
      messages = [];
      chat.innerHTML = "";
      chat.appendChild(welcome);
      welcome.style.display = "";
      setGenerating(false);
      showToast("Chat dibersihkan!");
    });

    document.querySelectorAll("[data-prompt]").forEach(btn => {
      btn.addEventListener("click", () => {
        promptInput.value = btn.dataset.prompt;
        autoResize();
        promptInput.focus();
      });
    });

    updateStatus("Siap", "ready");
    setTimeout(() => promptInput.focus(), 300);
  </script>
</body>
</html>
